<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirigiendo…</title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f5f5;color:#222;text-align:center;padding:16px}
  .box{max-width:360px}
  h1{font-size:22px}
</style>
</head>
<body>
<div class="box" id="msg"><p>Cargando…</p></div>
<script>
  // El código va después del "?" en el enlace. Ejemplo: https://x4vierstudio-spec.github.io/?A001
  var codigo = decodeURIComponent(location.search.replace("?", "")).trim().toUpperCase();
  var msg = document.getElementById("msg");

  function mostrar(titulo, texto){
    msg.innerHTML = "<h1></h1><p></p>";
    msg.querySelector("h1").textContent = titulo;
    msg.querySelector("p").textContent = texto;
  }

  fetch("enlaces.json?v=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(enlaces){
      var destino = enlaces[codigo];
      if (destino && destino.indexOf("http") === 0) {
        location.replace(destino);
      } else {
        mostrar("⭐ QR aún no activado", "Este código (" + (codigo || "sin código") + ") todavía no tiene un enlace asignado.");
      }
    })
    .catch(function(){
      mostrar("Error", "No se pudo cargar. Intenta de nuevo en un momento.");
    });
</script>
</body>
</html>
